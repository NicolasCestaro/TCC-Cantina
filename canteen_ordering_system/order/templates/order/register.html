{% extends 'base/base.html' %}
{% block title %}Registrar{% endblock title %}
{% block maincontent %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm mt-5">
        <div class="card-body">
          <h3 class="card-title mb-3 text-center">Criar Conta</h3>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
              </div>
            {% endfor %}
          {% endif %}

          <form action="" method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}

            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-success btn-block">Cadastrar</button>
            </div>
          </form>

          <div class="mt-3 text-center small text-muted">
            Já tem conta? <a href="/login/">Entrar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* ajustes rápidos para forms renderizados com as_p */
.card-body form p { margin-bottom: .75rem; }
.card-body form input, .card-body form select, .card-body form textarea {
  width: 100%;
  padding: .5rem .75rem;
  box-sizing: border-box;
  border-radius: .25rem;
  border: 1px solid #ced4da;
}
.btn-block { display: block; width: 100%; }
</style>
{% endblock maincontent %}
